[package]
name = "synchrony-rs"
version = "0.2.6"
edition = "2024"
authors = ["waki285 <suzuneu@suzuneu.com>", "relative <hi@relative.im>"]
description = "A fast JavaScript deobfuscator written in Rust"
license = "GPL-3.0-only"
repository = "https://github.com/waki285/synchrony-rs"
keywords = ["javascript", "deobfuscator", "deobfuscation", "ast"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"
include = [
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "LICENSE.md",
    "src/**",
    "examples/**",
]

rust-version = "1.88.0"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[bin]]
name = "synchrony"
path = "src/main.rs"
required-features = ["cli"]

[lib]
name = "synchrony_rs"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[features]
default = ["cli", "tracing"]
format = [
    "dep:biome_formatter",
    "dep:biome_js_formatter",
    "dep:biome_js_parser",
    "dep:biome_js_syntax",
    "dep:biome_console",
    "dep:biome_diagnostics",
    "dep:biome_parser",
    "dep:biome_rowan",
    "dep:biome_text_edit",
    "dep:biome_text_size",
    "dep:biome_unicode_table",
]
cli = ["dep:clap", "dep:serde", "dep:serde_json", "format"]
tracing = ["dep:tracing", "dep:tracing-subscriber"]
wasm = [
    "dep:serde",
    "dep:serde-wasm-bindgen",
    "dep:wasm-bindgen",
    "dep:js-sys",
    "format",
]

[dependencies]
anyhow = "1"
biome_formatter = { version = "=0.5.7", optional = true }
biome_js_formatter = { version = "=0.5.7", optional = true }
biome_js_parser = { version = "=0.5.7", optional = true }
biome_js_syntax = { version = "=0.5.7", optional = true }
biome_console = { version = "=0.5.7", optional = true }
biome_diagnostics = { version = "=0.5.7", optional = true }
biome_parser = { version = "=0.5.7", optional = true }
biome_rowan = { version = "=0.5.7", optional = true }
biome_text_edit = { version = "=0.5.7", optional = true }
biome_text_size = { version = "=0.5.7", optional = true }
biome_unicode_table = { version = "=0.5.7", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
regex = "1"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
js-sys = { version = "0.3", optional = true }
swc_atoms = "9"
swc_common = { version = "18", features = ["tty-emitter"] }
swc_ecma_ast = "20"
swc_ecma_codegen = "23"
swc_ecma_parser = "33"
swc_ecma_usage_analyzer = "28"
swc_ecma_utils = "26"
swc_ecma_visit = "20"
thiserror = "2"
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }

[lints.rust]
absolute_paths_not_starting_with_crate = "deny"
ambiguous_negative_literals = "deny"
closure_returning_async_block = "deny"
deref_into_dyn_supertrait = "deny"
elided_lifetimes_in_paths = "deny"
ffi_unwind_calls = "deny"
if_let_rescope = "deny"
impl_trait_overcaptures = "deny"
impl_trait_redundant_captures = "deny"
let_underscore_drop = "deny"
macro_use_extern_crate = "deny"
meta_variable_misuse = "deny"
missing_debug_implementations = "warn"
missing_docs = "warn"
missing_unsafe_on_extern = "deny"
non_ascii_idents = "deny"
redundant_imports = "deny"
redundant_lifetimes = "deny"
single_use_lifetimes = "deny"
tail_expr_drop_order = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unfulfilled_lint_expectations = "deny"
unit_bindings = "deny"
unnameable_types = "deny"
unsafe_attr_outside_unsafe = "deny"
unsafe_code = "warn" # Use expect to allow unsafe code in specific places
unsafe_op_in_unsafe_fn = "warn"
unused_extern_crates = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
unused_macro_rules = "deny"
unused_qualifications = "deny"
variant_size_differences = "warn"

[lints.clippy]
# restriction
restriction = { level = "warn", priority = -1 }
allow_attributes = "deny" # Use expect(lint) instead
arbitrary_source_item_ordering = "allow"
arithmetic_side_effects = "allow"
blanket_clippy_restriction_lints = "allow"
else_if_without_else = "allow"
dbg_macro = "deny"
exhaustive_enums = "warn"
exhaustive_structs = "allow"
expect_used = "allow"
field_scoped_visibility_modifiers = "allow"
implicit_return = "allow"
integer_division = "allow"
integer_division_remainder_used = "allow"
min_ident_chars = "allow"
missing_docs_in_private_items = "allow"
missing_inline_in_public_items = "allow"
missing_trait_methods = "allow"
mod_module_files = "allow"
needless_raw_strings = "allow"
non_ascii_literal = "allow"
pattern_type_mismatch = "allow"
print_stdout = "deny"
print_stderr = "deny"
pub_use = "allow"
pub_with_shorthand = "allow"
question_mark_used = "allow"
renamed_function_params = "allow"
single_call_fn = "allow"
single_char_lifetime_names = "allow"
std_instead_of_alloc = "allow"
std_instead_of_core = "allow"
shadow_reuse = "allow"
shadow_same = "allow"
shadow_unrelated = "allow"
unwrap_used = "deny"
wildcard_enum_match_arm = "allow"

# cargo
cargo = { level = "warn", priority = -1 }
cargo_common_metadata = "deny"
multiple_crate_versions = "allow"

# nursery
nursery = { level = "warn", priority = -1 }

# pedantic
pedantic = { level = "warn", priority = -1 }
cast_lossless = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cognitive_complexity = "allow"
if_not_else = "allow"
many_single_char_names = "allow"
module_name_repetitions = "allow"
redundant_closure_for_method_calls = "allow"
similar_names = "allow"
single_match_else = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
unreadable_literal = "allow"
unused_self = "allow"
