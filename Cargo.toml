[package]
name = "synchrony-rs"
version = "0.2.2"
edition = "2024"
authors = ["waki285 <suzuneu@suzuneu.com>", "relative <hi@relative.im>"]
description = "A fast JavaScript deobfuscator written in Rust"
license = "GPL-3.0-only"
repository = "https://github.com/waki285/synchrony-rs"
keywords = ["javascript", "deobfuscator", "deobfuscation", "ast"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"
include = [
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "LICENSE.md",
    "src/**",
    "examples/**",
]

rust-version = "1.88.0"

[[bin]]
name = "synchrony"
path = "src/main.rs"
required-features = ["cli"]

[lib]
name = "synchrony_rs"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[features]
default = ["cli", "tracing"]
format = [
    "dep:biome_formatter",
    "dep:biome_js_formatter",
    "dep:biome_js_parser",
    "dep:biome_js_syntax",
]
cli = ["dep:clap", "dep:serde", "dep:serde_json", "format"]
tracing = ["dep:tracing", "dep:tracing-subscriber"]
wasm = [
    "dep:serde",
    "dep:serde-wasm-bindgen",
    "dep:wasm-bindgen",
    "dep:js-sys",
    "format",
]

[dependencies]
anyhow = "1"
biome_formatter = { version = "0.5.7", optional = true }
biome_js_formatter = { version = "0.5.7", optional = true }
biome_js_parser = { version = "0.5.7", optional = true }
biome_js_syntax = { version = "0.5.7", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
regex = "1"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
js-sys = { version = "0.3", optional = true }
swc_atoms = "9"
swc_common = { version = "18", features = ["tty-emitter"] }
swc_ecma_ast = "19"
swc_ecma_codegen = "21"
swc_ecma_parser = "32"
swc_ecma_usage_analyzer = "27"
swc_ecma_utils = "25"
swc_ecma_visit = "19"
thiserror = "2"
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }

[lints.rust]
missing_debug_implementations = "warn"
unfulfilled_lint_expectations = "deny"

[lints.clippy]
allow_attributes = "deny" # Use expect(lint) instead
dbg_macro = "deny"
exhaustive_enums = "warn"
print_stdout = "deny"
print_stderr = "deny"
unwrap_used = "deny"

# cargo
cargo = { level = "warn", priority = -1 }
cargo_common_metadata = "deny"
multiple_crate_versions = "allow"

# nursery
nursery = { level = "warn", priority = -1 }

# pedantic
pedantic = { level = "warn", priority = -1 }
cast_lossless = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cognitive_complexity = "allow"
if_not_else = "allow"
many_single_char_names = "allow"
module_name_repetitions = "allow"
redundant_closure_for_method_calls = "allow"
similar_names = "allow"
single_match_else = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
unreadable_literal = "allow"
unused_self = "allow"